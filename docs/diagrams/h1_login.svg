<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="600" viewBox="0 0 1960 600" font-family="DejaVu Sans, Arial, sans-serif" fill="#111"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="980.0" y="36" font-size="19" text-anchor="middle" font-weight="bold">Hình 1 — Chi tiết trạng thái &quot;Đăng nhập&quot;</text><text x="980.0" y="62" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Nhãn mũi tên: điều xảy ra [điều kiện] / việc được làm.   ∞ = trạng thái có hình chi tiết riêng.</text><rect x="60" y="110" width="1790" height="410" rx="22" fill="none" stroke="#1a9be0" stroke-width="2.4"/><text x="82" y="138" font-size="16" text-anchor="start" font-weight="bold">Đăng nhập</text><rect x="250" y="230" width="290" height="101" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="395.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Trao khóa (TCP)</text><line x1="250" y1="266" x2="540" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="395.0" y="286" font-size="12.5" text-anchor="middle">do: client và server trao khóa</text><text x="395.0" y="303" font-size="12.5" text-anchor="middle">X25519; server ký khóa của mình</text><text x="395.0" y="320" font-size="12.5" text-anchor="middle">bằng Ed25519</text><rect x="780" y="230" width="300" height="101" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="930.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Xác thực</text><line x1="780" y1="266" x2="1080" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="930.0" y="286" font-size="12.5" text-anchor="middle">do: server kiểm tra mật khẩu bằng</text><text x="930.0" y="303" font-size="12.5" text-anchor="middle">PBKDF2; tối đa 5 lần thất bại</text><text x="930.0" y="320" font-size="12.5" text-anchor="middle">trên một kết nối</text><rect x="1320" y="230" width="290" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1465.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Gắn kênh UDP</text><line x1="1320" y1="266" x2="1610" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="1465.0" y="286" font-size="12.5" text-anchor="middle">do: server giữ conn_id 10 giây,</text><text x="1465.0" y="303" font-size="12.5" text-anchor="middle">chờ gói HELLO ở cổng 9001</text><circle cx="60" cy="275" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="60" y="305" font-size="12" text-anchor="middle" fill="#555">từ Hình 0</text><path d="M69,275 L250,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="155.0" y="249" font-size="12.5" text-anchor="middle">client mở TCP,</text><text x="155.0" y="265" font-size="12.5" text-anchor="middle">gửi KEY_EXCHANGE</text><path d="M540,275 L780,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="660.0" y="217" font-size="12.5" text-anchor="middle">server trả KEY_EXCHANGE</text><text x="660.0" y="233" font-size="12.5" text-anchor="middle">[chữ ký transcript đúng]</text><text x="660.0" y="249" font-size="12.5" text-anchor="middle">/ hai bên tạo 4 khóa;</text><text x="660.0" y="265" font-size="12.5" text-anchor="middle">client gửi LOGIN</text><path d="M1080,275 L1320,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1200.0" y="233" font-size="12.5" text-anchor="middle">LOGIN đúng / server cấp</text><text x="1200.0" y="249" font-size="12.5" text-anchor="middle">conn_id, trả AUTH_OK;</text><text x="1200.0" y="265" font-size="12.5" text-anchor="middle">client đóng TCP, gửi gói HELLO</text><path d="M885.0,230 L885.0,188 L975.0,188 L975.0,230" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="930.0" y="162" font-size="12.5" text-anchor="middle">lần đầu: client gửi REGISTER / server lưu tài khoản,</text><text x="930.0" y="178" font-size="12.5" text-anchor="middle">trả AUTH_OK; client gửi tiếp LOGIN</text><path d="M1610,275 L1841,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1850" cy="275" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M1844,269 L1856,281 M1844,281 L1856,269" stroke="#111" stroke-width="1.6"/><text x="1730.0" y="201" font-size="12.5" text-anchor="middle">server giải mã được gói</text><text x="1730.0" y="217" font-size="12.5" text-anchor="middle">HELLO / xóa conn_id khỏi</text><text x="1730.0" y="233" font-size="12.5" text-anchor="middle">bảng chờ, thêm vào danh sách</text><text x="1730.0" y="249" font-size="12.5" text-anchor="middle">online, gửi USER_LIST cho</text><text x="1730.0" y="265" font-size="12.5" text-anchor="middle">mọi người (= xác nhận)</text><text x="1864" y="280" font-size="12.5" text-anchor="start" fill="#555">thành công</text><text x="1864" y="296" font-size="12.5" text-anchor="start" fill="#555">→ Online</text><path d="M290,331 L290,511" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="290" cy="520" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M284,514 L296,526 M284,526 L296,514" stroke="#111" stroke-width="1.6"/><text x="302" y="355" font-size="12.5" text-anchor="start">quá 10 giây chưa có khóa</text><text x="302" y="371" font-size="12.5" text-anchor="start">chữ ký sai / khóa không hợp lệ</text><text x="302" y="387" font-size="12.5" text-anchor="start">/ đóng TCP</text><text x="260" y="550" font-size="12.5" text-anchor="start" fill="#555">thất bại → Chưa kết nối</text><path d="M820,331 L820,511" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="820" cy="520" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M814,514 L826,526 M814,526 L826,514" stroke="#111" stroke-width="1.6"/><text x="832" y="355" font-size="12.5" text-anchor="start">LOGIN sai / server trả AUTH_FAIL,</text><text x="832" y="371" font-size="12.5" text-anchor="start">client báo sai mật khẩu</text><text x="832" y="387" font-size="12.5" text-anchor="start">quá 10 giây không có thông điệp</text><text x="832" y="403" font-size="12.5" text-anchor="start">thông điệp giải mã không được</text><text x="832" y="419" font-size="12.5" text-anchor="start">/ đóng TCP</text><text x="790" y="550" font-size="12.5" text-anchor="start" fill="#555">thất bại → Chưa kết nối</text><path d="M1360,314 L1360,511" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1360" cy="520" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M1354,514 L1366,526 M1354,526 L1366,514" stroke="#111" stroke-width="1.6"/><text x="1372" y="338" font-size="12.5" text-anchor="start">server: quá 10 giây chưa có</text><text x="1372" y="354" font-size="12.5" text-anchor="start">gói HELLO / hủy conn_id</text><text x="1372" y="370" font-size="12.5" text-anchor="start">client: gửi HELLO 5 lần (mỗi 1 giây)</text><text x="1372" y="386" font-size="12.5" text-anchor="start">vẫn chưa có USER_LIST</text><text x="1330" y="550" font-size="12.5" text-anchor="start" fill="#555">thất bại → Chưa kết nối</text></svg>