<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="760" viewBox="0 0 2080 760" font-family="DejaVu Sans, Arial, sans-serif" fill="#111"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="1040.0" y="36" font-size="19" text-anchor="middle" font-weight="bold">Hình 3 — Một lần truyền tệp (người gửi → server → người nhận)</text><text x="1040.0" y="62" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Nhãn mũi tên: điều xảy ra [điều kiện] / việc được làm.   ∞ = trạng thái có hình chi tiết riêng.</text><text x="1040.0" y="80" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Mỗi tệp chạy một bản riêng của hình này. Chunk đi trên stream riêng (số ≥ 3), thỏa thuận đi trên Stream 1.</text><circle cx="40" cy="275" r="12" fill="#1a9be0"/><path d="M52,275 L147,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="249" font-size="12.5" text-anchor="middle">người gửi gửi</text><text x="100" y="265" font-size="12.5" text-anchor="middle">FILE_OFFER</text><path d="M160,262 L173,275 L160,288 L147,275 Z" fill="#fff" stroke="#111" stroke-width="1.6"/><rect x="400" y="230" width="270" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="535.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Chờ người nhận đồng ý</text><line x1="400" y1="266" x2="670" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="535.0" y="286" font-size="12.5" text-anchor="middle">do: server giữ đề nghị</text><text x="535.0" y="303" font-size="12.5" text-anchor="middle">tối đa 120 giây</text><rect x="880" y="230" width="330" height="101" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1045.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Đang truyền</text><line x1="880" y1="266" x2="1210" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="1045.0" y="286" font-size="12.5" text-anchor="middle">do: người gửi gửi chunk 1000 byte;</text><text x="1045.0" y="303" font-size="12.5" text-anchor="middle">server chuyển từng chunk; người</text><text x="1045.0" y="320" font-size="12.5" text-anchor="middle">nhận chậm thì server ngừng đọc</text><rect x="1450" y="230" width="270" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1585.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Người nhận kiểm tra</text><line x1="1450" y1="266" x2="1720" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="1585.0" y="286" font-size="12.5" text-anchor="middle">do: tính SHA-256</text><text x="1585.0" y="303" font-size="12.5" text-anchor="middle">của tệp đã nhận</text><rect x="1820" y="230" width="200" height="67" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1920.0" y="255" font-size="14.5" text-anchor="middle" font-weight="bold">Hoàn tất</text><line x1="1820" y1="266" x2="2020" y2="266" stroke="#1a9be0" stroke-width="2"/><text x="1920.0" y="286" font-size="12.5" text-anchor="middle">do: lưu vào downloads/</text><rect x="880" y="560" width="330" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1045.0" y="585" font-size="14.5" text-anchor="middle" font-weight="bold">Đã hủy</text><line x1="880" y1="596" x2="1210" y2="596" stroke="#1a9be0" stroke-width="2"/><text x="1045.0" y="616" font-size="12.5" text-anchor="middle">do: hai bên dừng gửi/nhận,</text><text x="1045.0" y="633" font-size="12.5" text-anchor="middle">người nhận xóa phần đã nhận</text><path d="M173,275 L400,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="286.5" y="217" font-size="12.5" text-anchor="middle">[người nhận online ∧</text><text x="286.5" y="233" font-size="12.5" text-anchor="middle">tên tệp hợp lệ]</text><text x="286.5" y="249" font-size="12.5" text-anchor="middle">/ server chuyển</text><text x="286.5" y="265" font-size="12.5" text-anchor="middle">FILE_OFFER</text><path d="M160,288 L160,600" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="160" cy="614" r="13" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><circle cx="160" cy="614" r="7.5" fill="#1a9be0"/><text x="172" y="335" font-size="12.5" text-anchor="start">[người nhận offline]</text><text x="172" y="351" font-size="12.5" text-anchor="start">/ server trả</text><text x="172" y="367" font-size="12.5" text-anchor="start">ERROR USER_OFFLINE</text><path d="M670,275 L880,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="775.0" y="233" font-size="12.5" text-anchor="middle">người nhận gửi FILE_ACCEPT</text><text x="775.0" y="249" font-size="12.5" text-anchor="middle">/ server báo FILE_ACCEPT</text><text x="775.0" y="265" font-size="12.5" text-anchor="middle">cho người gửi</text><path d="M1210,275 L1450,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1330.0" y="217" font-size="12.5" text-anchor="middle">server đã chuyển đủ byte</text><text x="1330.0" y="233" font-size="12.5" text-anchor="middle">VÀ đã nhận FILE_DONE</text><text x="1330.0" y="249" font-size="12.5" text-anchor="middle">/ chuyển FILE_DONE{sha256}</text><text x="1330.0" y="265" font-size="12.5" text-anchor="middle">cho người nhận</text><path d="M1720,275 L1820,275" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1770.0" y="249" font-size="12.5" text-anchor="middle">[SHA-256</text><text x="1770.0" y="265" font-size="12.5" text-anchor="middle">khớp]</text><path d="M1920.0,297 L1920.0,600" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1920.0" cy="614" r="13" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><circle cx="1920.0" cy="614" r="7.5" fill="#1a9be0"/><path d="M1000.0,230 L1000.0,188 L1090.0,188 L1090.0,230" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1045.0" y="162" font-size="12.5" text-anchor="middle">server nhận chunk trên stream người gửi tự chọn [đúng transfer_id, đúng offset]</text><text x="1045.0" y="178" font-size="12.5" text-anchor="middle">/ chuyển cho người nhận trên stream server tự chọn</text><path d="M535.0,314 L535.0,602.0 L880,602.0" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="547.0" y="340" font-size="12.5" text-anchor="start">quá 120 giây chưa trả lời</text><text x="547.0" y="356" font-size="12.5" text-anchor="start">một bên offline</text><text x="547.0" y="372" font-size="12.5" text-anchor="start">/ server gửi ERROR FILE_ABORTED</text><text x="547.0" y="388" font-size="12.5" text-anchor="start">cho cả hai bên</text><path d="M1045.0,331 L1045.0,560" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1057.0" y="357" font-size="12.5" text-anchor="start">chunk sai offset hoặc transfer_id</text><text x="1057.0" y="373" font-size="12.5" text-anchor="start">một bên offline</text><text x="1057.0" y="389" font-size="12.5" text-anchor="start">/ server gửi ERROR FILE_ABORTED</text><text x="1057.0" y="405" font-size="12.5" text-anchor="start">cho cả hai bên</text><path d="M1585.0,314 L1585.0,602.0 L1210,602.0" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1597.0" y="340" font-size="12.5" text-anchor="start">[SHA-256 không khớp]</text><text x="1597.0" y="356" font-size="12.5" text-anchor="start">/ người nhận báo lỗi</text><path d="M1045.0,644 L1045.0,695" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1045.0" cy="709" r="13" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><circle cx="1045.0" cy="709" r="7.5" fill="#1a9be0"/></svg>