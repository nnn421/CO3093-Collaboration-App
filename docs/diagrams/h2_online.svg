<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="790" viewBox="0 0 1820 790" font-family="DejaVu Sans, Arial, sans-serif" fill="#111"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="910.0" y="36" font-size="19" text-anchor="middle" font-weight="bold">Hình 2 — Chi tiết trạng thái &quot;Online&quot;</text><text x="910.0" y="62" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Nhãn mũi tên: điều xảy ra [điều kiện] / việc được làm.   ∞ = trạng thái có hình chi tiết riêng.</text><text x="910.0" y="80" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Ba vùng ngăn bởi nét đứt chạy song song: người dùng ở cả ba cùng lúc.</text><rect x="60" y="110" width="1330" height="640" rx="22" fill="none" stroke="#1a9be0" stroke-width="2.4"/><text x="82" y="138" font-size="16" text-anchor="start" font-weight="bold">Online</text><text x="82" y="162" font-size="12.5" text-anchor="start">entry: server thêm vào danh sách online, gửi USER_LIST cho mọi người đang online</text><text x="82" y="179" font-size="12.5" text-anchor="start">exit: server xóa khỏi danh sách online, gửi ERROR FILE_ABORTED cho bên kia của mọi tệp đang truyền,</text><text x="82" y="196" font-size="12.5" text-anchor="start">        gửi USER_LIST cho những người còn online</text><line x1="60" y1="213" x2="1390" y2="213" stroke="#1a9be0" stroke-width="2"/><line x1="60" y1="418" x2="1390" y2="418" stroke="#1a9be0" stroke-width="1.6" stroke-dasharray="8 6"/><line x1="60" y1="633" x2="1390" y2="633" stroke="#1a9be0" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="1530" y="420" width="250" height="67" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1655.0" y="445" font-size="14.5" text-anchor="middle" font-weight="bold">Đã ngắt</text><line x1="1530" y1="456" x2="1780" y2="456" stroke="#1a9be0" stroke-width="2"/><text x="1655.0" y="476" font-size="12.5" text-anchor="middle">(Hình 0)</text><text x="80" y="239" font-size="13" text-anchor="start" font-weight="bold" fill="#1a9be0">Vùng 1 — giữ kết nối</text><circle cx="110" cy="308" r="12" fill="#1a9be0"/><rect x="190" y="263" width="380" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="380.0" y="288" font-size="14.5" text-anchor="middle" font-weight="bold">Còn liên lạc</text><line x1="190" y1="299" x2="570" y2="299" stroke="#1a9be0" stroke-width="2"/><text x="380.0" y="319" font-size="12.5" text-anchor="middle">do: client gửi heartbeat mỗi 5 giây;</text><text x="380.0" y="336" font-size="12.5" text-anchor="middle">server trả lại mỗi heartbeat</text><path d="M122,308 L190,308" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><path d="M570,293 L615,293 L615,325 L570,325" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="629" y="297" font-size="12.5" text-anchor="start">server nhận gói bất kỳ từ client</text><text x="629" y="313" font-size="12.5" text-anchor="start">/ ghi lại thời điểm nhận</text><text x="629" y="329" font-size="12.5" text-anchor="start">(đi vòng: hạn 15 giây đếm lại từ đầu)</text><path d="M250,347 L250,387 L1381,387" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1390" cy="387" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M1384,381 L1396,393 M1384,393 L1396,381" stroke="#111" stroke-width="1.6"/><text x="264" y="379" font-size="12.5" text-anchor="start">15 giây không nhận gói nào</text><path d="M1399,387 L1490,387 L1490,443.5 L1530,443.5" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="80" y="444" font-size="13" text-anchor="start" font-weight="bold" fill="#1a9be0">Vùng 2 — nhắn tin</text><circle cx="110" cy="513" r="12" fill="#1a9be0"/><rect x="190" y="468" width="380" height="67" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="380.0" y="493" font-size="14.5" text-anchor="middle" font-weight="bold">Sẵn sàng chuyển tin</text><line x1="190" y1="504" x2="570" y2="504" stroke="#1a9be0" stroke-width="2"/><text x="380.0" y="524" font-size="12.5" text-anchor="middle">do: server đọc Stream 1 của client</text><path d="M122,513 L190,513" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><path d="M570,498 L615,498 L615,530 L570,530" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="629" y="502" font-size="12.5" text-anchor="start">client gửi MSG_BCAST / server chuyển cho mọi người online trừ người gửi</text><text x="629" y="518" font-size="12.5" text-anchor="start">client gửi MSG_DM [người nhận online] / server chuyển cho người nhận</text><text x="629" y="534" font-size="12.5" text-anchor="start">client gửi MSG_DM [người nhận offline] / server trả ERROR USER_OFFLINE</text><text x="629" y="550" font-size="12.5" text-anchor="start">client gửi thông điệp sai / server trả ERROR</text><path d="M250,535 L250,575 L1381,575" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="1390" cy="575" r="9" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M1384,569 L1396,581 M1384,581 L1396,569" stroke="#111" stroke-width="1.6"/><text x="264" y="567" font-size="12.5" text-anchor="start">client gửi quá 50 thông điệp sai</text><path d="M1399,575 L1490,575 L1490,463.5 L1530,463.5" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="80" y="659" font-size="13" text-anchor="start" font-weight="bold" fill="#1a9be0">Vùng 3 — truyền tệp</text><rect x="190" y="683" width="380" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="380.0" y="708" font-size="14.5" text-anchor="middle" font-weight="bold">Truyền tệp</text><circle cx="538" cy="704" r="5" fill="none" stroke="#111" stroke-width="1.4"/><circle cx="550" cy="704" r="5" fill="none" stroke="#111" stroke-width="1.4"/><line x1="190" y1="719" x2="570" y2="719" stroke="#1a9be0" stroke-width="2"/><text x="380.0" y="739" font-size="12.5" text-anchor="middle">mỗi tệp đang gửi hoặc nhận chạy một bản</text><text x="380.0" y="756" font-size="12.5" text-anchor="middle">Hình 3; nhiều tệp cùng lúc được</text><circle cx="110" cy="728" r="12" fill="#1a9be0"/><path d="M122,728 L190,728" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><path d="M1390,140 L1655,140 L1655,420" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1404" y="164" font-size="12.5" text-anchor="start">client gửi FIN (đăng xuất)</text><text x="1404" y="180" font-size="12.5" text-anchor="start">đăng nhập ở máy khác</text><text x="1404" y="196" font-size="12.5" text-anchor="start">hàng đợi gửi của client đầy</text><text x="1404" y="212" font-size="12.5" text-anchor="start">(client nhận quá chậm)</text></svg>