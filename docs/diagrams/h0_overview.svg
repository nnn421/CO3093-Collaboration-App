<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" font-family="DejaVu Sans, Arial, sans-serif" fill="#111"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="36" font-size="19" text-anchor="middle" font-weight="bold">Hình 0 — Vòng đời một người dùng trong ứng dụng (tổng quan)</text><text x="750.0" y="62" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Nhãn mũi tên: điều xảy ra [điều kiện] / việc được làm.   ∞ = trạng thái có hình chi tiết riêng.</text><circle cx="50" cy="245" r="12" fill="#1a9be0"/><rect x="120" y="200" width="270" height="67" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="255.0" y="225" font-size="14.5" text-anchor="middle" font-weight="bold">Chưa kết nối</text><line x1="120" y1="236" x2="390" y2="236" stroke="#1a9be0" stroke-width="2"/><text x="255.0" y="256" font-size="12.5" text-anchor="middle">do: client hiện màn hình đăng nhập</text><rect x="590" y="200" width="280" height="84" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="730.0" y="225" font-size="14.5" text-anchor="middle" font-weight="bold">Đăng nhập</text><circle cx="838" cy="221" r="5" fill="none" stroke="#111" stroke-width="1.4"/><circle cx="850" cy="221" r="5" fill="none" stroke="#111" stroke-width="1.4"/><line x1="590" y1="236" x2="870" y2="236" stroke="#1a9be0" stroke-width="2"/><text x="730.0" y="256" font-size="12.5" text-anchor="middle">do: trao khóa, kiểm tra mật khẩu,</text><text x="730.0" y="273" font-size="12.5" text-anchor="middle">gắn kênh UDP (Hình 1)</text><rect x="1060" y="200" width="330" height="101" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1225.0" y="225" font-size="14.5" text-anchor="middle" font-weight="bold">Online</text><circle cx="1358" cy="221" r="5" fill="none" stroke="#111" stroke-width="1.4"/><circle cx="1370" cy="221" r="5" fill="none" stroke="#111" stroke-width="1.4"/><line x1="1060" y1="236" x2="1390" y2="236" stroke="#1a9be0" stroke-width="2"/><text x="1225.0" y="256" font-size="12.5" text-anchor="middle">do (song song, Hình 2):</text><text x="1225.0" y="273" font-size="12.5" text-anchor="middle">giữ kết nối bằng heartbeat;</text><text x="1225.0" y="290" font-size="12.5" text-anchor="middle">chuyển tin nhắn; truyền tệp (Hình 3)</text><rect x="1060" y="500" width="330" height="101" rx="16" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><text x="1225.0" y="525" font-size="14.5" text-anchor="middle" font-weight="bold">Đã ngắt</text><line x1="1060" y1="536" x2="1390" y2="536" stroke="#1a9be0" stroke-width="2"/><text x="1225.0" y="556" font-size="12.5" text-anchor="middle">do: server xóa khỏi danh sách online,</text><text x="1225.0" y="573" font-size="12.5" text-anchor="middle">báo cho người còn online;</text><text x="1225.0" y="590" font-size="12.5" text-anchor="middle">client báo mất kết nối</text><path d="M62,245 L120,245" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="91" y="219" font-size="12.5" text-anchor="middle">mở</text><text x="91" y="235" font-size="12.5" text-anchor="middle">app</text><path d="M390,245 L590,245" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="490.0" y="219" font-size="12.5" text-anchor="middle">người dùng bấm</text><text x="490.0" y="235" font-size="12.5" text-anchor="middle">Đăng nhập</text><path d="M870,245 L1060,245" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="965.0" y="219" font-size="12.5" text-anchor="middle">client nhận</text><text x="965.0" y="235" font-size="12.5" text-anchor="middle">USER_LIST đầu tiên</text><path d="M730.0,200 L730.0,150 L255.0,150 L255.0,200" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="492.5" y="124" font-size="12.5" text-anchor="middle">đăng nhập thất bại</text><text x="492.5" y="140" font-size="12.5" text-anchor="middle">(sai mật khẩu, quá hạn chờ, lỗi giao thức)</text><path d="M1225.0,301 L1225.0,500" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="1237.0" y="327" font-size="12.5" text-anchor="start">client gửi FIN (người dùng đăng xuất)</text><text x="1237.0" y="343" font-size="12.5" text-anchor="start">15 giây không nhận gói nào</text><text x="1237.0" y="359" font-size="12.5" text-anchor="start">đăng nhập ở máy khác</text><text x="1237.0" y="375" font-size="12.5" text-anchor="start">client nhận quá chậm</text><text x="1237.0" y="391" font-size="12.5" text-anchor="start">client gửi quá 50 thông điệp sai</text><path d="M1060,550.5 L350,550.5 L350,267" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="725.0" y="542.5" font-size="12.5" text-anchor="middle">client quay về màn hình đăng nhập</text><path d="M170,267 L170,602" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><circle cx="170" cy="616" r="13" fill="#fff" stroke="#1a9be0" stroke-width="2.4"/><circle cx="170" cy="616" r="7.5" fill="#1a9be0"/><text x="182" y="327" font-size="12.5" text-anchor="start">người dùng</text><text x="182" y="343" font-size="12.5" text-anchor="start">đóng app</text></svg>